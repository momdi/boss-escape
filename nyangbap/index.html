<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>츄두리스트 — 오늘의 할 일</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.json?v=1">
<meta name="theme-color" content="#faf8f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="츄두리스트">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>

<div id="app">

  <header class="hd">
    <span class="hd-date" id="hdDate">2024-05-16</span>
    <span class="hd-div"></span>
    <button class="hd-food" id="hdFood" type="button" data-i18n-ti="feedTitle">
      <span class="hd-wallet">
        <span class="hd-coin">
          <span class="hd-coin-ico" id="hdKibbleIco"></span>
          <span class="hd-coin-label" data-i18n="currency">사료</span>
          <b class="hd-coin-num" id="hdKibble">0</b>
        </span>
        <span class="hd-coin hd-coin-gold" id="hdSpecial">
          <span class="hd-coin-ico" id="hdSpecialIco"></span>
          <span class="hd-coin-label" data-i18n="currencySpecial">황금 사료</span>
          <b class="hd-coin-num" id="hdSpecialNum">0</b>
        </span>
      </span>
    </button>
    <nav class="hd-acts">
      <button class="hd-ico" id="hdShop" type="button" data-i18n-al="tabShop" data-i18n-ti="tabShop">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h12l-1 9H3z"/><path d="M5 5V3h6v2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 7h6v1H5z" class="cut"/></svg>
      </button>
      <button class="hd-ico" id="hdAlbum" type="button" data-i18n-al="tabAlbum" data-i18n-ti="tabAlbum">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h10v12H3z"/><path d="M5 4h6v2H5zM5 7h6v1H5zM5 9h4v1H5z" class="cut"/></svg>
      </button>
    </nav>
  </header>

  <!-- ===== 집 ===== -->
  <section class="scene" id="scene">
    <canvas id="room"></canvas>
    <div class="scene-hint" id="sceneHint"></div>
    <div class="scene-acts">
      <button class="sbtn" id="giftBtn" type="button" data-i18n-al="giftAria" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7h12v7H2z"/><path d="M1 4h14v3H1z"/><path d="M7 4h2v10H7z" class="cut"/><path d="M5 1h2v3H5zM9 1h2v3H9z"/></svg>
      </button>
      <button class="sbtn" id="camBtn" type="button" data-i18n-al="camAria" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 4h3l1-2h6l1 2h3v10H1z"/><circle cx="8" cy="9" r="3" class="cut"/></svg>
      </button>
    </div>
    <div class="flash" id="flash"></div>
  </section>

  <main class="page" id="pageHome">
    <section class="notes">
      <div class="notes-head">
        <h2 class="notes-title" data-i18n="notesTitle">중요한 일</h2>
        <button class="notes-toggle" id="noteToggle" type="button" data-i18n-al="notesAdd" data-i18n-ti="notesAdd">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2h2v12H7z"/><path d="M2 7h12v2H2z"/></svg>
        </button>
      </div>
      <ul class="notes-list" id="noteList"></ul>
      <form class="notes-add" id="noteForm" hidden>
        <input id="noteInput" type="text" maxlength="40" data-i18n-ph="notesPlaceholder" autocomplete="off">
        <input id="noteDue" type="date" data-i18n-ti="notesDue">
        <button type="submit" data-i18n-al="addAria">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2h2v12H7z"/><path d="M2 7h12v2H2z"/></svg>
        </button>
      </form>
    </section>

    <h1 class="list-title" data-i18n="todayTitle">오늘의 할 일</h1>
    <ul class="todos" id="todoList"></ul>
    <form class="add" id="addForm">
      <input id="addInput" type="text" maxlength="24" data-i18n-ph="addPlaceholder" autocomplete="off" spellcheck="false">
      <button type="submit" data-i18n-al="addAria">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2h2v12H7z"/><path d="M2 7h12v2H2z"/></svg>
      </button>
    </form>
  </main>

  <!-- ===== 기록 (캘린더) ===== -->
  <main class="page" id="pageLog" hidden>
    <h1 class="list-title" data-i18n="logTitle">지난 기록</h1>
    <p class="page-sub" data-i18n="logSub"></p>
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" type="button" data-i18n-al="prevMonth">‹</button>
      <span class="cal-month" id="calMonth"></span>
      <button class="cal-nav" id="calNext" type="button" data-i18n-al="nextMonth">›</button>
    </div>
    <div class="cal-dow" id="calDow"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot">
      <span class="cal-legend"><i data-i18n="logLegendLow"></i><b class="l0"></b><b class="l1"></b><b class="l2"></b><b class="l3"></b><b class="l4"></b><i data-i18n="logLegendHigh"></i></span>
      <span class="cal-sum" id="calSum"></span>
    </div>
  </main>

  <!-- ===== 냥이 도감 ===== -->
  <main class="page" id="pageAlbum" hidden>
    <h1 class="list-title" data-i18n="albumTitle">냥이 도감</h1>
    <p class="page-sub" id="albumCount"></p>
    <div class="grid" id="albumGrid"></div>
  </main>

  <!-- ===== 상점 ===== -->
  <main class="page" id="pageShop" hidden>
    <h1 class="list-title" data-i18n="shopTitle">상점</h1>
    <div class="shop-tabs">
      <button class="on" data-shop="bowl" type="button" data-i18n="shopBowl">밥그릇</button>
      <button data-shop="gift" type="button" data-i18n="shopGift">선물</button>
    </div>
    <div class="shop-list" id="shopList"></div>
  </main>

  <!-- ===== 설정 ===== -->
  <main class="page" id="pageSet" hidden>
    <h1 class="list-title" data-i18n="settingsTitle">설정</h1>
    <div class="set-list" id="setList"></div>
  </main>

  <nav class="tabs" id="tabs">
    <button class="on" data-tab="home" type="button" data-i18n="tabHome">메모</button>
    <button data-tab="log" type="button" data-i18n="tabLog">캘린더</button>
    <button data-tab="set" type="button" data-i18n="settingsTitle">설정</button>
  </nav>

  <div class="toast" id="toast" hidden></div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-dim" id="sheetDim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script src="js/catanim.js?v=7"></script>
<script src="js/sprites.js?v=18"></script>
<script src="js/data.js?v=11"></script>
<script src="js/i18n.js?v=11"></script>
<script src="js/sound.js?v=4"></script>
<script src="js/state.js?v=6"></script>
<script src="js/scene.js?v=20"></script>
<script src="js/ui.js?v=14"></script>
<script src="js/app.js?v=14"></script>
<script src="js/desk-bridge.js?v=6"></script>
</body>
</html>
